<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVA Gestão de Desempenho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --navy:#0F2A47;
  --navy-2:#173a5e;
  --rose:#C98A96;
  --rose-light:#F1DCDF;
  --yellow:#F5C518;
  --gray:#6B7280;
  --gray-light:#E7E9EC;
  --bg:#F6F7F9;
  --white:#FFFFFF;
  --ok:#3E8E63;
  --warn:#C77B1D;
  --danger:#B23A48;
  --radius:14px;
  --shadow: 0 2px 10px rgba(15,42,71,0.06), 0 10px 30px rgba(15,42,71,0.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--navy);
  font-family:'Manrope',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  color:var(--navy);
  margin:0;
}
#app{max-width:1180px;margin:0 auto;padding:20px 20px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 22px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--navy),var(--navy-2));
  display:flex;align-items:center;justify-content:center;
  color:var(--yellow);font-family:'Fraunces',serif;font-weight:700;font-size:16px;
  flex-shrink:0;
}
.brand-text .name{font-weight:800;font-size:15px;color:var(--navy);}
.brand-text .tag{font-size:11px;color:var(--gray);letter-spacing:.03em;text-transform:uppercase;}
.nav-actions{display:flex;gap:8px;}
.btn{
  font-family:'Manrope',sans-serif;
  border:none;cursor:pointer;border-radius:10px;
  padding:10px 16px;font-size:13.5px;font-weight:700;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-2);}
.btn-accent{background:var(--yellow);color:var(--navy);}
.btn-accent:hover{filter:brightness(1.05);}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--gray-light);}
.btn-ghost:hover{background:var(--gray-light);}
.btn-rose{background:var(--rose);color:#fff;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.card{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:26px;
}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
@media (max-width:820px){
  .grid-2,.grid-3{grid-template-columns:1fr;}
}

/* LANDING */
.hero{
  background:var(--navy);
  border-radius:20px;
  padding:44px 40px;
  color:#fff;
  position:relative;
  overflow:hidden;
  margin-bottom:24px;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;
  border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,.35),transparent 70%);
}
.hero::before{
  content:"";position:absolute;left:-40px;bottom:-90px;width:220px;height:220px;
  border-radius:50%;background:radial-gradient(circle,rgba(201,138,150,.35),transparent 70%);
}
.hero h1{color:#fff;font-size:32px;max-width:560px;position:relative;}
.hero p{color:#cfd9e6;max-width:520px;margin-top:10px;font-size:15px;line-height:1.5;position:relative;}
.hero .eyebrow{
  color:var(--yellow);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:10px;position:relative;
}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:8px;}
@media (max-width:720px){.choice-row{grid-template-columns:1fr;}}
.choice-card{
  background:#fff;border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);
  cursor:pointer;border:2px solid transparent;transition:all .15s ease;
  display:flex;flex-direction:column;gap:10px;
}
.choice-card:hover{border-color:var(--yellow);transform:translateY(-2px);}
.choice-card .icon{
  width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0; box-shadow:0 6px 16px rgba(15,42,71,.18);
}
.choice-card .icon svg{width:26px;height:26px;display:block;}
.icon-colab{ background:linear-gradient(135deg,#C98A96 0%,#0F2A47 100%); }
.icon-gestor{ background:linear-gradient(135deg,#2E9B9B 0%,#0F2A47 100%); }
.icon-admin{ background:linear-gradient(135deg,#F5C518 0%,#0F2A47 100%); }
.choice-card h3{font-size:19px;}
.choice-card p{color:var(--gray);font-size:13.5px;line-height:1.5;margin:0;}

/* PROGRESS */
.progress-wrap{margin-bottom:22px;}
.progress-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.progress-top .step-label{font-weight:700;font-size:13.5px;color:var(--navy);}
.progress-top .pct{font-size:12.5px;color:var(--gray);font-weight:600;}
.progress-bar{height:8px;border-radius:6px;background:var(--gray-light);overflow:hidden;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--rose),var(--yellow));border-radius:6px;transition:width .3s ease;}
.steps-mini{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.steps-mini span{
  font-size:11px;padding:4px 9px;border-radius:20px;background:var(--gray-light);color:var(--gray);font-weight:600;
}
.steps-mini span.active{background:var(--navy);color:#fff;}
.steps-mini span.done{background:#DCEBE1;color:var(--ok);}

/* FORM */
label.field-label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
select, input[type=text], input[type=date]{
  width:100%;padding:11px 12px;border-radius:9px;border:1.6px solid var(--gray-light);
  font-family:'Manrope',sans-serif;font-size:14px;color:var(--navy);background:#fff;
}
select:focus, input:focus{outline:none;border-color:var(--rose);}
.field{margin-bottom:16px;}
.hint{font-size:12px;color:var(--gray);margin-top:5px;}
.error-box{background:#FBE9EA;border:1.4px solid #EBBEC2;color:var(--danger);padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:14px;font-weight:600;}
.success-box{background:#E4F3EA;border:1.4px solid #BFE3CC;color:var(--ok);padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:14px;font-weight:600;}

.comp-block{border:1.6px solid var(--gray-light);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
.comp-block h4{font-size:15.5px;margin-bottom:3px;}
.comp-block .comp-desc{color:var(--gray);font-size:12.5px;margin-bottom:14px;line-height:1.5;}
.q-row{margin-bottom:14px;}
.q-text{font-size:13.8px;color:var(--navy);margin-bottom:8px;font-weight:600;line-height:1.4;}
.scale{display:flex;gap:6px;flex-wrap:wrap;}
.scale button{
  flex:1;min-width:64px;
  border:1.6px solid var(--gray-light);background:#fff;border-radius:9px;padding:9px 4px;
  font-size:11.5px;font-weight:700;color:var(--gray);cursor:pointer;transition:all .12s ease;text-align:center;
}
.scale button.sel{background:var(--navy);color:#fff;border-color:var(--navy);}
.scale button:hover{border-color:var(--rose);}

.group-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--rose);font-weight:800;margin:20px 0 10px;}

.nav-buttons{display:flex;justify-content:space-between;margin-top:22px;}

/* REVIEW */
.review-sec{margin-bottom:18px;}
.review-sec h4{font-size:13px;text-transform:uppercase;color:var(--gray);letter-spacing:.05em;margin-bottom:8px;}
.review-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--gray-light);font-size:13px;gap:14px;}
.review-item .q{color:var(--navy);flex:1;}
.review-item .a{font-weight:800;color:var(--rose);white-space:nowrap;}

/* DASHBOARD */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
@media (max-width:900px){.kpi-grid{grid-template-columns:1fr 1fr;}}
.kpi{background:#fff;border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);}
.kpi .val{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--navy);}
.kpi .lbl{font-size:12px;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
.kpi .sub{font-size:11.5px;color:var(--gray);margin-top:6px;}

.section-title{font-size:20px;margin:26px 0 14px;display:flex;align-items:center;gap:10px;}
.section-title .dot{width:8px;height:8px;border-radius:50%;background:var(--rose);}

.filters-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:#fff;border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:20px;}
.filters-bar .field{margin-bottom:0;min-width:150px;}
.filters-bar .field label{font-size:10.5px;}
.filters-bar select{padding:8px 10px;font-size:12.5px;}

.chart-card{background:#fff;border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px;}
.chart-card h3{font-size:15px;margin-bottom:2px;}
.chart-card .sub{font-size:12px;color:var(--gray);margin-bottom:14px;}

/* 9BOX */
.box9-wrap{display:flex;gap:28px;flex-wrap:wrap;}
.box9-table{
  display:grid;grid-template-columns:86px repeat(3,1fr);grid-template-rows:auto repeat(3,1fr);
  gap:7px;width:520px;
}
@media (max-width:640px){.box9-table{width:100%;grid-template-columns:64px repeat(3,1fr);}}
.box9-corner{ }
.box9-collabel{
  text-align:center;font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;
  padding-bottom:4px;align-self:end;
}
.box9-rowlabel{
  display:flex;align-items:center;justify-content:flex-end;text-align:right;
  font-size:11px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.03em;
  padding-right:8px;
}
.box9-cell{
  border-radius:12px;position:relative;padding:9px;overflow:visible;min-height:118px;
  border:2px solid transparent;transition:box-shadow .15s ease, border-color .15s ease;
}
.box9-cell:hover{ box-shadow:0 6px 18px rgba(15,42,71,.18); border-color:currentColor; }
.box9-cell .cell-label{font-size:11px;font-weight:800;letter-spacing:.01em;}
.box9-dots{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:flex-end;gap:4px;padding:9px;}
.dot-person{
  width:28px;height:28px;border-radius:50%;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;
  cursor:pointer;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);
  transition:transform .12s ease;
}
.dot-person:hover{transform:scale(1.22);}
.box9-axis-y{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:800;font-size:13px;color:var(--navy);display:flex;align-items:center;justify-content:center;letter-spacing:.04em;}
.box9-axis-x{text-align:center;font-weight:800;font-size:13px;color:var(--navy);margin-top:8px;letter-spacing:.04em;}
.box9-legend{flex:1;min-width:240px;}
.box9-legend h4{font-size:13px;text-transform:uppercase;color:var(--gray);margin-bottom:10px;}
.quad-tag{display:flex;align-items:center;gap:8px;font-size:12px;padding:7px 10px;border-radius:10px;margin:0 0 6px;font-weight:700;}
.quad-tag .swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.quad-tag .txt{flex:1;}
.quad-tag .txt small{display:block;font-weight:500;color:var(--gray);font-size:10.5px;margin-top:1px;}

.person-panel{
  background:#fff;border-radius:14px;padding:22px;box-shadow:var(--shadow);margin-top:16px;
  border-left:5px solid var(--rose);
}
.person-panel h3{font-size:18px;}
.person-panel .meta{color:var(--gray);font-size:13px;margin-bottom:14px;}
.tag-strong{background:#E4F3EA;color:var(--ok);}
.tag-dev{background:#FBE9EA;color:var(--danger);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;}

table.data-table{width:100%;border-collapse:collapse;font-size:13px;}
table.data-table th{text-align:left;padding:9px 10px;background:var(--bg);color:var(--gray);font-size:11px;text-transform:uppercase;letter-spacing:.03em;}
table.data-table td{padding:9px 10px;border-bottom:1px solid var(--gray-light);}
table.data-table tr:hover td{background:#FAFBFC;}

.rank-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rank-bar-row .rname{width:120px;font-size:12.5px;font-weight:700;flex-shrink:0;}
.rank-bar-track{flex:1;height:16px;background:var(--gray-light);border-radius:8px;overflow:hidden;}
.rank-bar-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--navy),var(--rose));}
.rank-bar-val{width:40px;text-align:right;font-size:12.5px;font-weight:800;color:var(--navy);}

.empty-state{text-align:center;padding:50px 20px;color:var(--gray);}
.empty-state .big{font-size:40px;margin-bottom:10px;}

.gate-box{max-width:380px;margin:60px auto;text-align:center;}
.gate-box input{text-align:center;font-size:20px;letter-spacing:.3em;}

.badge-role{font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--gray-light);color:var(--gray);font-weight:700;margin-left:6px;}

.export-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.disclosure{font-size:12px;color:var(--gray);background:#FCEFC0;border-radius:9px;padding:10px 14px;margin-bottom:18px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--gray-light);border-radius:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script src="script.js"></script>
</body>
</html>
